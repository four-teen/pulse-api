openapi: 3.1.0
info:
  title: PULSE Presidential API
  version: 1.0.0
  description: Same-origin frontend proxy and authenticated PHP API. Source synchronization is CLI-only and disabled until explicitly configured.
paths:
  /health:
    get:
      summary: Service liveness
      responses:
        '200':
          description: PULSE API is running
  /auth/login:
    post:
      summary: Authenticate the president
      description: Requires an Origin header matching APP_URL. Issues an HttpOnly, SameSite=Strict session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passcode]
              properties:
                passcode:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        '200':
          description: Signed in
        '401':
          description: Incorrect passcode
        '403':
          description: Origin or proxy secret rejected
        '429':
          description: Temporary sign-in lock
  /auth/session:
    get:
      summary: Restore the presidential session
      security: [{presidentialSession: []}]
      responses:
        '200':
          description: Authenticated president profile
        '401':
          description: Session missing or expired
  /auth/logout:
    post:
      summary: Destroy the current session
      description: Requires an Origin header matching APP_URL.
      security: [{presidentialSession: []}]
      responses:
        '200':
          description: Signed out and cookie expired
  /v1/president/dashboard:
    get:
      summary: Read university records and integration states
      description: Reads validated private snapshots only. Never makes a vendor API request. Missing metrics are null; zero is reserved for confirmed zero values.
      security: [{presidentialSession: []}]
      responses:
        '200':
          description: University dashboard
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, generatedAt, updatedAt, dataState, periodKey, periodLabel, coverage, categorySources, campuses, sources]
                properties:
                  schemaVersion: {const: 1}
                  generatedAt: {type: string, format: date-time}
                  updatedAt: {type: [string, 'null'], format: date-time}
                  dataState: {enum: [awaiting_data, partial, stale, ready]}
                  periodKey: {type: [string, 'null']}
                  periodLabel: {type: [string, 'null']}
                  coverage:
                    type: object
                    required: [availableMetrics, totalMetrics]
                    properties:
                      availableMetrics: {type: integer, minimum: 0}
                      totalMetrics: {type: integer, minimum: 0}
                  categorySources:
                    type: object
                    additionalProperties: {enum: [sinq, oracle, pad, null]}
                  campuses:
                    type: array
                    minItems: 7
                    maxItems: 7
                    items: {$ref: '#/components/schemas/Campus'}
                  sources:
                    type: array
                    minItems: 3
                    maxItems: 3
                    items: {$ref: '#/components/schemas/Source'}
        '401':
          description: Presidential authentication required
        '500':
          description: Private record storage unavailable
  /v1/campuses:
    get:
      summary: Read the campus catalogue and available campus metrics
      security: [{presidentialSession: []}]
      responses:
        '200':
          description: Object containing schemaVersion and campuses, with the same campus schema as the dashboard
        '401':
          description: Presidential authentication required
  /v1/integrations:
    get:
      summary: Read redacted integration availability
      security: [{presidentialSession: []}]
      responses:
        '200':
          description: Object containing schemaVersion and sources. Credentials and private API endpoint configuration are never returned.
        '401':
          description: Presidential authentication required
  /v1/faculty-profiles:
    get:
      summary: Read a page of synchronized Synk faculty profiles
      description: Reads a validated private snapshot only. The Synk source is never contacted by this request. Search matches name, campus, college, and rank.
      security: [{presidentialSession: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: q, in: query, schema: {type: string, maxLength: 400}}
      responses:
        '200':
          description: Profile page and synchronization state
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, sourceId, mode, status, observedAt, facultyProfiles, pagination]
                properties:
                  schemaVersion: {const: 1}
                  sourceId: {const: sinq}
                  mode: {enum: [local_test, production]}
                  status: {enum: [disabled, configuration_required, awaiting_sync, connected]}
                  observedAt: {type: [string, 'null'], format: date-time}
                  facultyProfiles:
                    type: array
                    items: {$ref: '#/components/schemas/FacultyProfile'}
                  pagination:
                    type: object
                    required: [total, limit, offset]
                    properties:
                      total: {type: integer, minimum: 0}
                      limit: {type: integer, minimum: 1, maximum: 100}
                      offset: {type: integer, minimum: 0}
        '401':
          description: Presidential authentication required
  /backend/pulse_api.php:
    get:
      summary: Synk's read-only PULSE faculty export
      description: Source API. Requires an Authorization Bearer token configured on the PHP host; GET only. Exports an approved faculty profile field allowlist and never accepts writes.
      security: [{sinqBearer: []}]
      parameters:
        - {name: resource, in: query, required: true, schema: {const: faculty-profiles}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 250, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: Synk faculty profile page}
        '401': {description: Bearer token required}
components:
  securitySchemes:
    presidentialSession:
      type: apiKey
      in: cookie
      name: pulse_session
    sinqBearer:
      type: http
      scheme: bearer
  schemas:
    Campus:
      type: object
      required: [id, name, mark, color, tint, students, previousStudents, faculty, programs, retention, budget, utilization, research, extension, production, inventory]
      properties:
        id: {enum: [access, isulan, tacurong, kalamansig, lutayan, palimbang, bagumbayan]}
        name: {type: string}
        mark: {type: string}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        tint: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        students: {$ref: '#/components/schemas/Count'}
        previousStudents: {$ref: '#/components/schemas/Count'}
        faculty: {$ref: '#/components/schemas/Count'}
        programs: {$ref: '#/components/schemas/Count'}
        retention: {$ref: '#/components/schemas/Percentage'}
        budget: {$ref: '#/components/schemas/Amount'}
        utilization: {$ref: '#/components/schemas/Percentage'}
        research:
          type: object
          properties:
            active: {$ref: '#/components/schemas/Count'}
            completed: {$ref: '#/components/schemas/Count'}
            publications: {$ref: '#/components/schemas/Count'}
            funding: {$ref: '#/components/schemas/Amount'}
        extension:
          type: object
          properties:
            active: {$ref: '#/components/schemas/Count'}
            completed: {$ref: '#/components/schemas/Count'}
            communities: {$ref: '#/components/schemas/Count'}
            beneficiaries: {$ref: '#/components/schemas/Count'}
            sessions: {$ref: '#/components/schemas/Count'}
        production:
          type: object
          properties:
            enterprises: {$ref: '#/components/schemas/Count'}
            revenue: {$ref: '#/components/schemas/Amount'}
            expenses: {$ref: '#/components/schemas/Amount'}
            target: {$ref: '#/components/schemas/Amount'}
        inventory:
          type: object
          properties:
            buildings: {$ref: '#/components/schemas/Count'}
            classrooms: {$ref: '#/components/schemas/Count'}
            laboratories: {$ref: '#/components/schemas/Count'}
            assets: {$ref: '#/components/schemas/Count'}
            serviceable: {$ref: '#/components/schemas/Count'}
            value: {$ref: '#/components/schemas/Amount'}
    Source:
      type: object
      required: [id, name, website, status, updatedAt]
      properties:
        id: {enum: [sinq, oracle, pad]}
        name: {type: string}
        website: {type: string, format: uri}
        status: {enum: [not_connected, configuration_required, awaiting_sync, connected, stale, invalid_data, period_mismatch]}
        updatedAt: {type: [string, 'null'], format: date-time}
    Count: {type: [integer, 'null'], minimum: 0, maximum: 1000000000}
    FacultyProfile:
      type: object
      required: [id, fullName, campus, college, rank, education, updatedAt]
      properties:
        id: {type: integer, minimum: 1}
        fullName: {type: string}
        campus: {type: string}
        college: {type: string}
        rank: {type: string}
        education:
          type: object
          properties:
            bachelor: {$ref: '#/components/schemas/EducationRecord'}
            master: {$ref: '#/components/schemas/EducationRecord'}
            doctoral: {$ref: '#/components/schemas/EducationRecord'}
        updatedAt: {type: [string, 'null'], format: date-time}
    EducationRecord:
      type: object
      required: [degree, institution, specialization, status]
      properties:
        degree: {type: string}
        institution: {type: string}
        specialization: {type: string}
        status: {type: string}
    Amount: {type: [number, 'null'], minimum: 0, maximum: 1000000000000000}
    Percentage: {type: [number, 'null'], minimum: 0, maximum: 100}
